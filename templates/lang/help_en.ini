; BYD Autos - help texts, English
;
; English is the fallback level: keys missing in another language are taken
; from here, so this file must always be complete and must carry the same set
; of keys as the German one.
;
; Every value is quoted and contains no double quote of its own.

[HILFE]
K01 = "BYD Autos"
K02 = "This plugin connects BYD vehicles to Loxone through the BYD account: state of charge, odometer, range, plug state, remaining charging time, speed, vehicle state, driver door lock, seat and battery heating and the location. Optionally it can lock and unlock, run the climate control, set seat and battery heating, make the car honk, flash the lights and close the windows."
K03 = "<b>This version is untested.</b> BYD publishes no documentation of its interface. What the plugin knows about field names and commands comes from two open sources. The <b>field names</b> have been checked against the raw response of a BYD Seal U Design contributed by a user since 0.9.11; the <b>commands</b> have still never been measured against a car. Hence 0.9.x rather than 1.0.0, hence write commands are disabled by default, and hence the field table has an <i>Origin</i> column."
K04 = "How the plugin is built"
K05 = "Three jobs, three files. A background <b>service</b> fetches the values at the configured interval and stores them in a cache. The <b>web interface</b> only displays that cache. The <b>endpoint</b> for the Miniserver also reads only the cache - which is why it answers in milliseconds rather than seconds, and why opening the plugin page does not trigger a request to the manufacturer."
K06 = "Write commands go through a queue: the endpoint drops a file, the service processes it and writes the answer beside it. The endpoint never talks to BYD itself. Air conditioning, seat and battery heating are <b>analogue</b> virtual outputs in the import file: the value for the placeholder (target temperature or level) comes from Loxone - from the block driving the output. How the Miniserver sends the off command there has not been measured."
K07 = "First setup"
K08 = "On the Settings tab enter the user name and password of the BYD account - the same ones you use in the BYD app. For write commands also enter the control PIN."
K09 = "Start the service and wait for one cycle. The <i>Detected vehicles</i> table will then show what the account holds."
K10 = "Look at the self-check on the Test tab. Its first line answers whether our own endpoint responds over HTTP - that is the check which finds the most expensive class of failure."
K11 = "On the <i>Loxone integration</i> tab either add the MQTT subscription or generate the import file for Loxone Config."
K12 = "Why some fields stay empty"
K13 = "The response of the interface is not mapped onto guessed names but through a list of acceptable spellings. If none matches, the field stays <b>empty</b> - no 0 is invented, because a 0 would look like a measurement in Loxone. Which fields matched on your vehicle is shown on the Test tab; the button <i>Suggest field mapping</i> lists every leaf of the response with its path. That way the device answers the question about the names."
K14 = "MQTT or HTTP"
K15 = "MQTT is the standard route: the LoxBerry gateway creates the virtual inputs itself, and in Loxone a suitably named input is enough. Since LoxBerry 3 the gateway is part of the system and is switched on under System → MQTT Gateway rather than installed separately. States such as ignition or lock are sent retained so that Loxone has them straight after a restart; measurements and the sign of life are not. Which ones they are is shown on the MQTT tab."
K16 = "Over MQTT the timestamp is sent, not the age - at the moment of sending the age is always zero. The receiving side computes it. Over HTTP the age is in the answer directly, because the endpoint computes it at the moment of the question."
K17 = "Failure detection"
K18 = "Virtual inputs keep their last value. If the service fails, everything looks normal in the app. Two values are therefore wired up: OK and ALTER (grows as long as nothing new arrives). OK is 0 if the last poll returned nothing for this vehicle or the snapshot is older than three times the configured polling interval; ALTER stays unchanged beside it. If there is no data at all yet, the endpoint answers with HTTP 503 and GRUND=KEINE_DATEN - Loxone then keeps the last values and shows the outage at the input. The special case ALTER = -1 means <i>there has never been a successful poll</i> and looks fresher than any real value - so always evaluate OK as well."
K19 = "The polling interval"
K20 = "Every poll wakes the car: the interface asks the vehicle to report rather than reading a cache. Too short an interval costs standby power and may hit a rate limit. The lower bound of 120 seconds is our own choice, not a figure from BYD; the default of 300 seconds matches the default of the ioBroker adapter for the same interface."
K21 = "Credentials and token"
K22 = "User name, password and PIN are kept in a separate file with mode 0600, not in the configuration the web interface displays. They are never shown - only their length. Leaving the password field empty deletes nothing; there is a separate checkbox for deletion, and it also removes the backup copy next to the configuration folder. The token protects the unauthenticated endpoint; it appears in the addresses in the Miniserver and is only regenerated on explicit request. The <i>Back up settings</i> file contains, besides the settings and the token, the user name, password, control PIN and country code - treat it like a password. On restore every value is checked with the same rule as in the form; a partly valid file changes nothing at all, and an empty token in the file means: the current one stays. Restored credentials apply from the next start of the service. The file begins with a readable header (_hinweis, _stand) that the restore skips. If a saved value would not pass the plugin's own restore, a yellow sentence at the button says so and the header of the file names the keys (_warnung) - the file is still delivered in full. If an entry is rejected on the Settings or MQTT tab, nothing is saved - not even the other fields; after the reload your typed values are back in the form and the rejected field has a red border. Password and PIN are never filled in again, so enter a password you just typed once more."
K23 = "What is not possible"
K24 = "<b>Starting and stopping charging</b> is not offered: the library used names no method for it. A control without effect is worse than none. Still unmeasured is the effect of the switching commands - there is no BYD account here. The field names are measured since 0.9.11: they have been checked against the raw response of a real vehicle, and the <i>Origin</i> column on the Test tab says which. To try a command out, use the <i>dry run</i> described further down."
K25 = "Pre-conditioning via the departure assistant"
K26 = "When enabled, the service listens to two topics of the departure assistant: the minutes until departure and a release value. As soon as the configured lead time is reached it issues the climate command - once per departure, and only if writing commands are permitted at all. If the assistant falls silent the value expires after the configured maximum age; a value left standing in the broker therefore does not claim the same departure every day. <b>All that has been measured is which topics the assistant carries</b> - not that a BYD vehicle accepts the climate command."
K27 = "Charging recommendation"
K28 = "From an existing price or surplus value in the broker the plugin computes the field LADEEMPF: 1 means <i>charge now</i>, 0 means <i>do not</i>. Nothing is switched - the decision stays visible in Loxone. Whether the recommendation applies <i>below</i> or <i>above</i> the threshold is not guessed but configured: for prices cheap means charge, for surplus plenty means charge. If the last value is too old, 0 is sent rather than nothing; a virtual input keeps its last value, and a recommendation that fell silent would otherwise keep acting."
K29 = "Computed values and the list of charging sessions"
K30 = "Five fields do not come from the vehicle: the number of consecutive unsuccessful polls, whether the vehicle is within the radius of the home position, the consumption of the last completed trip, the charging recommendation and the energy charged. For consumption and energy the usable battery capacity is the ingredient - without it both stay empty instead of sending a 0 that looks like a measurement. A charging session is detected from a change of the field LAEDT and listed on the <i>Charging sessions</i> tab. The list lives in the data folder. The installer clears that folder on every update - which is why the plugin puts the list next to the configuration folder beforehand and fetches it back afterwards. It survives an update because the plugin carries it, not because the folder remains. It does not survive an <b>uninstall</b>. The grey button <i>Download charging sessions (CSV)</i> on the same tab delivers all rows as a table (semicolon, decimal point, empty field = not known); without any charging session only the header line."
K31 = "Dry run"
K32 = "Every writing command on the Test tab can be issued with the <i>dry run</i> tick. The command then takes the same path up to immediately before sending: the guards apply, vehicle and library function are looked up, the parameters are checked - only nothing is dispatched, and the answer says so with the word PROBE at the start. This is the way to settle the command names on a real vehicle without moving it."
K33 = "Protecting the BYD account"
K34 = "If BYD rejects the sign-in, the plugin records this permanently in the data folder. After five rejected sign-ins within 24 hours it no longer signs in - neither the service nor the watchdog nor the button <i>Suggest field mapping</i> - until new credentials are saved on the Settings tab; the page says so at the top in one sentence. This way BYD does not lock the account the BYD app uses as well. The same for the control PIN: after three failed unlocks all switching commands are blocked for one hour (answer PIN_GESPERRT); a newly saved PIN lifts the block. At most 30 switching commands per hour go to BYD, at most 20 per polling cycle. In addition, the same set value (air conditioning on including temperature, or off, climate schedule, lock or unlock, seat climate and battery heating level, close windows) for the same vehicle goes out only once within 60 seconds; the endpoint answers the repetition with <i>UNVERAENDERT=1</i> and sends nothing. A different value goes out at once. Poll, find and flash are not affected. While the service is running, <i>Suggest field mapping</i> shows its last answer instead of waking the car again; without the service there is at most one poll per 120 seconds. The numbers are chosen, not measured: after how many failed attempts BYD itself locks is not known. While the sign-in lock applies, it is also posted once in the LoxBerry notification area (one notification per lock; new credentials end it). A rejected sign-in is recognised by an exception class of the pybyd library whose name ends in AuthenticationError. Whether the installed version has such a class is shown by the <i>Self-test of the service</i> on the Test tab; if it is missing, a WARNING appears there, because the lock would then never apply."
K35 = "States without a statement and silent vehicles"
K36 = "States are sent retained over MQTT (column <i>retained</i> on the MQTT tab). If a successful poll does not deliver a state or delivers it empty, it is sent retained as - (dash), never as an empty message and never as a stale old value. If a vehicle is silent for a while - the poll fails -, its states stay in place and fahrzeugN/OK goes to 0: in Loxone a state only counts together with OK. If a vehicle disappears from the account, its states are sent once as - and its OK becomes 0. Without credentials, with a rejected sign-in and when the service ends, ok 0 and fahrzeugN/OK 0 are sent. The number of vehicles is only sent once a poll has delivered vehicles. How Loxone reads a dash at a virtual input has not been measured on the Miniserver."
K37 = "The subscription in the MQTT gateway"
K38 = "The plugin writes its subscription itself to the file <i>mqtt_subscriptions.cfg</i> in its configuration folder - at service start and when saving on the MQTT tab, only if it differs. MQTT gateway version 1 reads this file and subscribes from it (established in the gateway source code); a manual entry is therefore no longer needed and does no harm. Whether version 2 reads the file as well has not been measured. If the topic prefix is changed or MQTT is switched off, the plugin clears its own retained topics under the previous prefix at the broker and reports the result; foreign topics are left untouched."
K39 = "Charging recommendation from Spotpreis aWATTar or Tibber"
K40 = "Off by default. When switched on, the service listens to the <b>rank of the current hour</b> (1 = cheapest of the next 24 hours) from the plugin Spotpreis aWATTar or Spotpreis Tibber - via their MQTT topics <i>&lt;prefix&gt;/rank</i> and <i>/rankd</i> plus heartbeat, never via their files. It sends <i>lade_empfehlung</i> = 1 if the rank is at most the configured number of cheapest hours, otherwise 0, plus <i>lade_empfehlung_grund</i>; both non-retained, on every change and otherwise every 5 minutes. If the source has been silent for more than 5 minutes, reports no prices or no rank is available, <i>-</i> is sent and the Test tab shows it in yellow - there is then no recommendation, as without this setting. After the service starts, the first rank only arrives with the next full set of the source (aWATTar within 30 minutes, Tibber at the next hour). When the setting is switched off or the service ends, <i>-</i> is sent once. Nothing is switched on the car. Prerequisite: the Spotpreis plugin publishes via MQTT; if it uses a different prefix there, enter it in the field <i>MQTT prefix of the price source</i>."

; BYD Autos - Hilfetexte, Deutsch
;
; Diese Datei liest LBWeb::gethelp() ueber readlanguage(). Sie muss unter
; templates/lang/ liegen, nicht neben der help.html - der Mechanismus sucht sie
; dort. Der dritte Parameter von lbheader() nennt die HTML-Datei; ist er leer,
; wird die Hilfe NIE angezeigt, und von aussen sieht das aus wie "keine Hilfe
; geschrieben".
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keines.
; Ein fehlender Schluessel hinterlaesst eine leere Stelle, ohne dass etwas
; gemeldet wird - beide Sprachen fuehren deshalb dieselbe Schluesselmenge.

[HILFE]
K01 = "BYD Autos"
K02 = "Das Plugin bindet Fahrzeuge von BYD über das BYD-Konto an Loxone an: Ladezustand, Kilometerstand, Reichweite, Ladezustand des Steckers, Restladezeit, Geschwindigkeit, Fahrzeugzustand, Türschloss der Fahrertür, Sitz- und Batterieheizung sowie den Standort. Auf Wunsch lassen sich Verriegelung, Klimatisierung, Sitz- und Batterieheizung schalten, das Auto suchen lassen, blinken und die Fenster schließen."
K03 = "<b>Diese Fassung ist ungeprüft.</b> BYD veröffentlicht keine Beschreibung seiner Schnittstelle. Was das Plugin über Feldnamen und Befehle weiß, stammt aus zwei offenen Quellen und ist an keinem Fahrzeug gemessen. Deshalb 0.9.x und nicht 1.0.0, deshalb sind schreibende Befehle ab Werk gesperrt, und deshalb steht in der Feldtabelle eine Spalte <i>Herkunft</i>."
K04 = "Wie das Plugin aufgebaut ist"
K05 = "Drei Aufgaben, drei Dateien. Ein <b>Dienst</b> im Hintergrund holt die Werte im eingestellten Takt und legt sie als Zwischenspeicher ab. Die <b>Oberfläche</b> zeigt nur diesen Zwischenspeicher. Der <b>Endpunkt</b> für den Miniserver liest ebenfalls nur ihn - deshalb antwortet er in Millisekunden und nicht in Sekunden, und deshalb löst ein Klick auf das Plugin keinen Abruf beim Hersteller aus."
K06 = "Schreibende Befehle laufen über eine Warteschlange: der Endpunkt legt eine Datei ab, der Dienst arbeitet sie ab und legt die Antwort daneben. Der Endpunkt spricht nie selbst mit BYD."
K07 = "Erste Einrichtung"
K08 = "Im Reiter Einstellungen Benutzername und Passwort des BYD-Kontos eintragen - dieselben, mit denen Sie sich in der BYD-App anmelden. Für schreibende Befehle zusätzlich die Steuer-PIN."
K09 = "Den Dienst starten und einen Takt abwarten. Danach steht in der Tabelle <i>Erkannte Fahrzeuge</i>, was das Konto führt."
K10 = "Im Reiter Test die Selbstprüfung ansehen. Die erste Zeile beantwortet, ob der eigene Endpunkt über HTTP antwortet - das ist die Prüfung, die die teuerste Fehlerklasse findet."
K11 = "Im Reiter <i>Einbindung in Loxone</i> entweder das MQTT-Abo eintragen oder die Importdatei für Loxone Config erzeugen."
K12 = "Warum manche Felder leer bleiben"
K13 = "Die Antwort der Schnittstelle wird nicht auf geratene Namen abgebildet, sondern über eine Liste zulässiger Schreibweisen. Trifft keine davon, bleibt das Feld <b>leer</b> - es wird keine 0 erfunden, denn eine 0 sähe in Loxone aus wie ein Messwert. Welche Felder bei Ihrem Fahrzeug getroffen haben, steht im Reiter Test; der Knopf <i>Feldzuordnung vorschlagen</i> listet jedes Blatt der Antwort mit seinem Pfad auf. Damit beantwortet das Gerät die Frage nach den Namen."
K14 = "MQTT oder HTTP"
K15 = "MQTT ist der Regelweg: das Gateway des LoxBerry legt die virtuellen Eingänge selbst an, und in Loxone genügt ein passend benannter Eingang. Das Gateway ist seit LoxBerry 3 Bestandteil des Systems und wird unter System &rarr; MQTT Gateway eingeschaltet, nicht nachinstalliert."
K16 = "Über MQTT wird der Zeitstempel gesendet, nicht das Alter - beim Senden ist das Alter immer null. Die Gegenseite rechnet es aus. Über HTTP steht das Alter dagegen unmittelbar in der Antwort, weil der Endpunkt im Augenblick der Frage rechnet."
K17 = "Ausfallerkennung"
K18 = "Virtuelle Eingänge behalten ihren letzten Wert. Fällt der Dienst aus, sieht in der App alles normal aus. Verdrahtet werden deshalb zwei Werte: OK (0 heißt, dieser Abruf hat nichts gebracht) und ALTER (wächst, solange nichts Neues kommt). Der Sonderfall ALTER = -1 heißt <i>es hat noch nie einen erfolgreichen Abruf gegeben</i> und sieht frischer aus als jeder echte Wert - OK ist deshalb immer mit auszuwerten."
K19 = "Der Takt"
K20 = "Jeder Abruf weckt das Fahrzeug: die Schnittstelle fordert das Auto zur Meldung auf, statt in einen Zwischenspeicher zu sehen. Ein zu dichter Takt kostet Ruhestrom und kann in eine Sperre laufen. Die Untergrenze von 120 Sekunden ist eine eigene Wahl, keine Angabe von BYD; die Vorgabe von 300 Sekunden entspricht der Vorgabe des ioBroker-Adapters derselben Schnittstelle."
K21 = "Zugangsdaten und Token"
K22 = "Benutzername, Passwort und PIN liegen in einer eigenen Datei mit den Rechten 0600, nicht in der Konfiguration, die die Oberfläche anzeigt. Sie werden nie angezeigt - nur ihre Länge. Ein leer gelassenes Passwortfeld löscht nichts; zum Löschen gibt es ein eigenes Häkchen, und das räumt auch die Zweitschrift neben dem Konfigurationsordner ab. Das Token schützt den unangemeldeten Endpunkt; es steht in den Adressen im Miniserver und wird nur auf ausdrücklichen Wunsch neu gewürfelt."
K23 = "Was nicht geht"
K24 = "<b>Laden starten und anhalten</b> wird nicht angeboten: die verwendete Bibliothek nennt dafür keine Methode. Ein Bedienelement ohne Wirkung ist schlimmer als keines. Ebenso gibt es keinen Trockenlauf für die Schaltbefehle - die Knöpfe im Reiter Test wirken sofort am Fahrzeug, und das steht auch daneben."
K25 = "Vorklimatisierung am Abfahrtsassistenten"
K26 = "Ist sie eingeschaltet, hört der Dienst zwei Themen des Abfahrtsassistenten mit: die Minuten bis zur Abfahrt und einen Freigabewert. Sobald die eingestellte Vorlaufzeit erreicht ist, setzt er den Klimabefehl ab - einmal je Abfahrt, und nur, wenn schreibende Befehle überhaupt freigegeben sind. Verstummt der Assistent, verfällt der Wert nach dem eingestellten Höchstalter; ein im Broker stehengebliebener Wert behauptet also nicht jeden Tag dieselbe Abfahrt. <b>Gemessen ist nur, welche Themen der Assistent führt</b> - nicht, dass ein BYD-Fahrzeug den Klimabefehl annimmt."
K27 = "Ladeempfehlung"
K28 = "Das Plugin rechnet aus einem vorhandenen Preis- oder Überschusswert im Broker das Feld LADEEMPF: 1 heißt <i>jetzt laden</i>, 0 heißt <i>nicht</i>. Geschaltet wird nichts - die Entscheidung bleibt in Loxone sichtbar. Ob die Empfehlung bei Werten <i>unter</i> oder <i>über</i> der Grenze gilt, wird nicht geraten, sondern eingestellt: bei Preisen ist billig gleich laden, bei Überschuss ist viel gleich laden. Ist der letzte Wert zu alt, wird 0 gesendet und nicht geschwiegen; ein virtueller Eingang behält seinen letzten Wert, und eine Empfehlung, die verstummt, wirkte sonst weiter."
K29 = "Gerechnete Größen und die Liste der Ladevorgänge"
K30 = "Fünf Felder kommen nicht vom Fahrzeug: die Zahl der aufeinanderfolgenden erfolglosen Abrufe, ob das Fahrzeug im Umkreis der Heimatposition steht, der Verbrauch der letzten abgeschlossenen Fahrt, die Ladeempfehlung und die geladene Energie. Für Verbrauch und Energie ist die nutzbare Batteriekapazität die Zutat - ohne sie bleiben beide leer, statt eine 0 zu senden, die wie eine Messung aussieht. Ein Ladevorgang wird am Wechsel des Feldes LAEDT erkannt und im Reiter <i>Ladevorgänge</i> aufgelistet. Die Liste liegt im Datenordner; sie überlebt eine Aktualisierung, aber <b>keine Deinstallation</b>."
K31 = "Trockenlauf"
K32 = "Jeder schreibende Befehl im Reiter Test lässt sich mit dem Haken <i>Trockenlauf</i> absetzen. Der Befehl geht dann denselben Weg bis unmittelbar vor das Senden: die Wachen greifen, Fahrzeug und Bibliotheksfunktion werden gesucht, die Parameter werden geprüft - nur abgesetzt wird nichts, und die Antwort sagt das mit dem Wort PROBE am Anfang. Das ist der Weg, die Befehlsnamen an einem echten Fahrzeug zu klären, ohne es zu bewegen."

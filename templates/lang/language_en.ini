ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_SCHRITTE = "The topic group of this plugin is:"
ABO_UNBEKANNT = "The version of your MQTT gateway could not be determined. <b>Version&nbsp;1</b> reads the subscription file the plugin creates itself – no manual entry is needed. <b>Version&nbsp;2:</b> whether the topic group appears there by itself has not been measured on this installation."
ABO_V2 = "<b>MQTT gateway V2.</b> Only what is in the LoxBerry source code is established: under V2 the <i>Subscriptions</i> page has its own interface and its buttons are disabled. That the topic group appears there by itself and the data points are ticked has <b>not been measured</b> on this installation. The plugin creates its subscription file anyway; whether V2 reads it has not been measured either."
ABO_WARNUNG = "<b>MQTT gateway V1.</b> The plugin enters this subscription itself in the file <span class='sm-mono'>mqtt_subscriptions.cfg</span> in its configuration folder, and gateway V1 reads it (established in the gateway source code). A manual entry under <i>System → MQTT Gateway</i>, section <i>Subscriptions</i>, is therefore no longer needed; if one is already there, it does no harm. If nothing arrives all the same, the subscription is the first place to look."
AUTOSTART_AUS = "The MQTT gateway is not set to autostart (<span class='sm-mono'>System → MQTT Gateway</span>). Messages are sent, but probably nobody is listening."
AUTOSTART_EIN = "The gateway is set to autostart. It comes up by itself after a LoxBerry restart."
GATEWAY_ERKLAERUNG = "Since LoxBerry 3 the MQTT gateway is <b>part of the system</b>, not a plugin. It is not installed separately but switched on under <span class='sm-mono'>System → MQTT Gateway</span>."
H_ABO = "The subscription in the MQTT gateway"
H_THEMEN = "Every topic this plugin publishes"
H_ZUSTAND = "State of the gateway"
NICHT_GEFUNDEN = "No MQTT section could be found in the LoxBerry <span class='sm-mono'>general.json</span>. Without it nothing can be forwarded."
PLATZHALTER = "<span class='sm-mono'>N</span> stands for the sequence number of the vehicle, starting at 1."
RETAIN_ERKLAERUNG = "Only states are sent retained – ignition, lock or charging state, for example – so that Loxone has the current picture straight after a restart of the Miniserver or the gateway. Measurements with a time reference are sent without, so that no old value looks current after an outage. The timestamp ts and the two OK topics are never retained: they are the sign of life. Nor is FEHLFOLGE: the count of unsuccessful polls is a statement of the service about itself, and a retained “0” would stay in place after the service has ended. A state without a statement is sent retained as <b>-</b> (dash), never empty. If a vehicle is only silent for a while, its states stay in place and fahrzeugN/OK goes to 0 – a state only counts together with OK."
THEMEN_ERKLAERUNG = "This list is built from the same source as the status line of the endpoint. The MQTT path therefore carries the same values as the HTTP path — a plugin whose MQTT message contains less than its HTTP line makes migration impossible, and does so quietly: values do arrive, just not all of them. The Test tab verifies the match."

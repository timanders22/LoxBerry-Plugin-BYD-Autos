T_THEMA = "Topic"
T_UDP = "UDP input of the gateway"
UMBENENNUNG = "Over MQTT the <b>timestamp</b> is sent, not the age: at the moment of sending the age is always zero. The receiving side computes it. In Loxone: <span class='sm-mono'>age = (Loxone time + 1230768000) − ts</span> — Loxone counts seconds since 1 January 2009."


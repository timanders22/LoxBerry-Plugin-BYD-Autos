[LADUNG]
ERKLAERUNG = "A charging session is detected from a change of the field <code>LAEDT</code> — BYD does not report it. The list lives in <code>verlauf/ladungen.csv</code> in the data folder. <b>The installer wipes that folder on every update</b>; the plugin therefore carries the list across itself: <code>preupgrade.sh</code> puts it next to the configuration folder, <code>postinstall.sh</code> fetches it back. It does <b>not</b> survive an uninstall — that removes this backup copy as well. Copy the file out of the data folder beforehand if you want to keep it past that."
GENAUIGKEIT = "<b>What these numbers are.</b> Start and end are the moments of the <i>polls</i> at which the change was noticed — they may be off by up to one polling interval. The kWh are computed from the change in state of charge and the capacity on file, not measured: charging losses are not in them, and a wrongly entered capacity distorts every row by the same factor."
H_CSV = "Downloads <b>all</b> recorded charging sessions as a table, oldest first: vehicle, start, end, duration in minutes, state of charge before and after, odometer, kWh charged. Separator semicolon, decimal point; an empty field means <i>not known</i>. Without any charging session the file contains only the header line. The button changes nothing."
H_TITEL = "Detected charging sessions"
K_ANZAHL = "Recorded"
K_ANZAHL_H = "rows in the file"
K_CSV = "Download charging sessions (CSV)"
K_SUMME = "Energy charged"
K_SUMME_H = "computed over %d of %d rows, only those with a capacity on file"
LEER = "No charging session recorded yet. An entry is only made once the service has seen a <i>change</i> from „charging“ to „not charging“ — a session already running at the first start therefore does not count."
T_DAUER = "Duration"
T_ENDE = "End"
T_KM = "Odometer"
T_KOSTEN = "Cost"
T_KWH = "kWh"
T_PREIS = "Price"
T_SOC = "State of charge"
T_START = "Start"


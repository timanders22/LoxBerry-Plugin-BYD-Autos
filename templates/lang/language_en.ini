ABO_UNBEKANNT = "The version of your MQTT gateway could not be determined. <b>Version&nbsp;1</b> reads the subscription file the plugin creates itself – no manual entry is needed. <b>Version&nbsp;2:</b> whether the topic group appears there by itself has not been measured on this installation."
ABO_V2 = "<b>MQTT gateway V2.</b> Only what is in the LoxBerry source code is established: under V2 the <i>Subscriptions</i> page has its own interface and its buttons are disabled. That the topic group appears there by itself and the data points are ticked has <b>not been measured</b> on this installation. The plugin creates its subscription file anyway; whether V2 reads it has not been measured either."
ABO_WARNUNG = "<b>MQTT gateway V1.</b> The plugin enters this subscription itself in the file <span class='sm-mono'>mqtt_subscriptions.cfg</span> in its configuration folder, and gateway V1 reads it (established in the gateway source code). A manual entry under <i>System → MQTT Gateway</i>, section <i>Subscriptions</i>, is therefore no longer needed; if one is already there, it does no harm. If nothing arrives all the same, the subscription is the first place to look."
AUTOSTART_AUS = "The MQTT gateway is not set to autostart (<span class='sm-mono'>System → MQTT Gateway</span>). Messages are sent, but probably nobody is listening."
AUTOSTART_EIN = "The gateway is set to autostart. It comes up by itself after a LoxBerry restart."
GATEWAY_ERKLAERUNG = "Since LoxBerry 3 the MQTT gateway is <b>part of the system</b>, not a plugin. It is not installed separately but switched on under <span class='sm-mono'>System → MQTT Gateway</span>."
H_ABO = "The subscription in the MQTT gateway"
H_THEMEN = "Every topic this plugin publishes"
H_ZUSTAND = "State of the gateway"
NICHT_GEFUNDEN = "No MQTT section could be found in the LoxBerry <span class='sm-mono'>general.json</span>. Without it nothing can be forwarded."
PLATZHALTER = "<span class='sm-mono'>N</span> stands for the sequence number of the vehicle, starting at 1."
RETAIN_ERKLAERUNG = "Only states are sent retained – ignition, lock or charging state, for example – so that Loxone has the current picture straight after a restart of the Miniserver or the gateway. Measurements with a time reference are sent without, so that no old value looks current after an outage. The timestamp ts and the two OK topics are never retained: they are the sign of life. Nor is FEHLFOLGE: the count of unsuccessful polls is a statement of the service about itself, and a retained “0” would stay in place after the service has ended. A state without a statement is sent retained as <b>-</b> (dash), never empty. If a vehicle is only silent for a while, its states stay in place and fahrzeugN/OK goes to 0 – a state only counts together with OK. A measurement without a statement is sent as <b>-1</b> (the interior temperature as <b>-999</b>); latitude and longitude are then not sent at all, because -1 would be a real location there. The HTTP status line still shows a dash for it."
THEMEN_ERKLAERUNG = "This list is built from the same source as the status line of the endpoint. The MQTT path therefore carries the same values as the HTTP path — a plugin whose MQTT message contains less than its HTTP line makes migration impossible, and does so quietly: values do arrive, just not all of them. The Test tab verifies the match."
T_AUTOSTART = "Gateway autostart"
T_BEDEUTUNG = "Meaning"
T_BROKER = "Broker"
T_PLUGIN = "This plugin sends over MQTT"
T_RETAIN = "Retained"
T_THEMA = "Topic"
T_UDP = "UDP input of the gateway"
UMBENENNUNG = "Over MQTT the <b>timestamp</b> is sent, not the age: at the moment of sending the age is always zero. The receiving side computes it. In Loxone: <span class='sm-mono'>age = (Loxone time + 1230768000) − ts</span> — Loxone counts seconds since 1 January 2009."

[LOX]
ALLES_TEXT = "The two buttons produce ready-made import files for Loxone Config. Inputs are imported under <span class='sm-mono'>Virtual Inputs → Predefined HTTP devices → Import template…</span>, outputs under <span class='sm-mono'>Virtual Outputs → Predefined devices → Import template…</span> — note that the output button lacks the word HTTP."
BILD_ALT = "Plugin blocks in Loxone Config"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
EINGRIFF = "only with the second tick"
EINLEITUNG = "Two paths are available, equivalent, and they do not exclude each other. Over <b>MQTT</b> the gateway creates the virtual inputs itself; the <b>HTTP endpoint</b> delivers all values of a vehicle in one request, with ready-made templates – and it is the only path for write commands. The sample project and the four pages in step 8 use HTTP."
HERKUNFT_BESTAND = "measured"
HERKUNFT_DOKU = "documentation"
HERKUNFT_GERECHNET = "computed"
HERKUNFT_UNBEKANNT = "unknown origin (%s)"
H_ALLES = "Create everything at once"
H_TITEL = "Loxone integration"
K_TOKEN_NEU = "Create a new token"
K_VORLAGE = "Create template for Loxone Config"
K_VORLAGE_VO = "Create template for the control commands"
MEHRERE_FAHRZEUGE = "Several vehicles: one address per vehicle"
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S1_TEXT = "Both paths are equivalent. <b>HTTP</b> (step 3): one template per vehicle, one request for all values, the age of every value comes along, and the browser shows right away what arrives – this is how the sample project and the pages in step 8 work. <b>MQTT</b> (off by default): the gateway creates the input names itself and additionally delivers the charging recommendation by electricity price. Both paths at once give duplicate inputs."
S1_TITEL = "Step 1: choose the path"
S2_TEXT = "The topic group of this plugin is:"
S2_TITEL = "Step 2: the subscription in the MQTT gateway"
S3_BEFEHLE = "<p>The title is for humans, the search text for the machine: the title may change without any existing installation noticing — what is searched for is still the text in the second column. The semicolon belongs <b>in the pattern</b>: Loxone searches literally and takes the first hit, and without the semicolon <span class='sm-mono'>KM=</span> would also occur inside a future <span class='sm-mono'>RESTKM=</span>.</p>"
S3_HERKUNFT = "The <b>Origin</b> column is meant seriously. <b>Documentation</b> means: the field name comes from an open source and was never measured against a car here. <b>Computed</b> means: the field does not come from the vehicle at all but arises here — if an ingredient is missing it stays empty. A field nobody measured must not look like one somebody did. The Test tab shows which fields the library actually matched on <b>your</b> vehicle."
S3_OK = "OK is 0 as soon as the snapshot is older than three times the polling interval (currently %d seconds); ALTER stays unchanged beside it. If there is no data at all yet, the endpoint answers with HTTP 503 and GRUND=KEINE_DATEN."
S3_STRICH = "A <b>dash</b> as a value means: this value is not available. No 0 is sent on purpose — a 0 would look like a measurement. Loxone then keeps the last valid value, and the ALTER field says how old it is."
S3_TEXT = "One virtual HTTP input with this address fetches all values in a single call. One command recognition per value, using the search text from the table below."
S3_TITEL = "Step 3: virtual inputs over HTTP"
S4_TEXT = "The location is returned in a separate response so that the status line consists of whole numbers only. A latitude with a decimal point among integers would be a trap for a command recognition."
S4_TITEL = "Step 4: location"
S5_KEIN_LADEN = "<b>Starting and stopping charging is not offered here.</b> The library used names no method for it. An output the manufacturer cannot serve is not offered at all: a block that only collects refusals is worse than none."
S5_TEXT = "One virtual output per command. Use the host name of the LoxBerry as the address of the output and the path from the table as the command; the generated import file does exactly that. Air conditioning, seat and battery heating are <b>analogue</b> outputs there: the value comes from the block driving the output – the target temperature as <span class='sm-mono'>&lt;v.1&gt;</span>, the level as <span class='sm-mono'>&lt;v.0&gt;</span>. Since 0.9.26 <b>climate</b> has no off command any more; it is stopped via its own command <span class='sm-mono'>BYD_1_KLIMA_AUS</span>; seat and battery heating send level 0 when switched off. This has not been measured on the Miniserver. Lock, unlock, find vehicle and flash lights additionally need the second tick on the Settings tab."
S5_TITEL = "Step 5: sending commands"
S5_WARNUNG = "These addresses contain the token. If you create a new token you must update all of them — a virtual output does not evaluate the answer, so a failure would go unnoticed."
S6_TEXT = "The token protects the unauthenticated endpoint. The second address answers the question „is the token entered in Loxone still valid?“ <b>without triggering anything on the car</b> — no device contact, no write access. Without such a route there are only two bad options: either you really switch something, or you never find out."
S6_TITEL = "Step 6: token and self-test"
S7_TEXT = "<b>Virtual inputs keep their last value.</b> If the service fails, everything looks normal in the app. Three things are therefore wired up: <span class='sm-mono'>OK</span> (0 means this poll returned nothing, or the snapshot is older than three times the polling interval), <span class='sm-mono'>ALTER</span> (grows as long as nothing new arrives) and a <b>Value Validator</b> on ALTER: if the LoxBerry itself stands still, OK and ALTER freeze, and only the validator notices that ALTER no longer changes (page “BYD Autos” in step 8, Tmc three times the polling time). The special case <span class='sm-mono'>ALTER = −1</span> means “there has never been a successful poll” – so always evaluate OK as well."
S7_TITEL = "Step 7: failure detection"
S8_TEXT = "Four pages from the LoxBerry plugins sample project, built and connected there in Loxone Config. One block per row; Loxone Config lists them all in the block search (key F5). If you only want monitoring, take over the first page alone. The names apply to vehicle 1 as the templates create them; the template titles are fixed (BYD_1_…), also with an English interface. The sample project does not use intervening commands (lock, find, flash)."
S8_TITEL = "Step 8: four pages from the sample project to rebuild"
S9_TEXT = "Call these four addresses once in a browser. The fourth is the most important: only a <b>refusal</b> for an invented action makes the three successes meaningful."
S9_TITEL = "Step 9: cross-check"
TOKEN_NEU = "A new token was created. All previous addresses in the Miniserver are now invalid and must be updated."
T_ADRESSE = "Address"
T_BAUSTEIN = "Block (type)"
T_BEDEUTUNG = "Meaning"
T_BEFEHL = "Search text (command recognition)"
T_EINGAENGE = "Connect inputs to"
T_EINHEIT = "Unit"
T_ERWARTUNG = "Expected answer"
T_HERKUNFT = "Origin"
T_NAMENSVORSCHLAG = "Name (suggestion)"
T_PARAMETER = "Parameters"
T_PRUEFUNG = "Call"
T_SELBSTTEST = "Self-test (triggers nothing)"
T_TITEL = "Title (suggestion)"
T_TOKEN = "Token"
T_ZYKLUS = "Polling cycle"
VORLAGEN_FAHRZEUG = "Templates for vehicle %s"
VORLAGE_HINWEIS = "Created by the LoxBerry plugin BYD Autos. Importing twice results in duplicate blocks."
VORLAGE_UNGEPRUEFT = "This vehicle has never answered - all fields are included. After the first successful poll, fetch the template again; it will then contain only the fields the car really delivers."
VORLAGE_VO_EINGRIFF = "With the second tick, locking, find vehicle and flashing are included as well."
VORLAGE_VO_HINWEIS = "Control commands of the LoxBerry plugin BYD Autos. They only work if write commands are enabled on the Settings tab."
VORLAGE_ZWEIMAL = "Loxone Config <b>creates new objects on import and overwrites nothing</b>. Importing twice means duplicate blocks on the same address — and Config says nothing about it."

[BAUSTEIN]
HINWEISE_TITEL = "Notes"
S1_H1 = "The message “Auto gestört” only comes after 10 minutes of fault. If the LoxBerry itself stands still, the Value Validator notices it after 15 minutes; the message follows 10 minutes later."
S1_H2 = "On no. 13: if the LoxBerry stands still, all inputs keep their last value; only the frozen BYD_1_ALTER gives it away. Every poll wakes the vehicle – do not set the interval in the plugin below 300 s; if you raise it or the polling time on the container, set Tmc to three times the polling time."
S1_H3 = "On no. 19–25: a threshold switch behind a polled input gives a short pulse at every poll; the switch-on delay no. 25 swallows it. The formulas no. 19 and 21 make sure that a value never reported (0, for example after a restart of the Miniserver) does not count as low."
S1_H4 = "On no. 28–30: “Meldung Ladung beendet” comes at every end of charging after at least one minute of charging – also when the cable is pulled or the charge is aborted."
S1_H5 = "The announcements “Ladung beendet” and “Keine Daten mehr” are spoken by the plugin itself (tab Settings, voice output, on by default) – no block is needed for them."
S1_H6 = "Second vehicle: in the tab “Loxone integration” fetch the templates for vehicle 2 (container “BYD 2”, commands BYD_2_…) and create the pages a second time with these commands; lead the faults of both vehicles via a further OR before the switch-on delay – never two sources directly into one notification."
S1_H7 = "A dash from the plugin means “not available” – the input then keeps its last value. Once the vehicle has answered, the input template only contains the fields it delivers; before that all 42, as in the sample project."
S1_SCHRITT1 = "In the plugin tab “%s” enter user name, password and control PIN of the BYD account, press “%s” and wait one interval (5 minutes). If you want charged energy and consumption, enter the usable battery capacity; if you want “at home”, the home position. Tab “%s” → “%s”: a line BYD;OK=1;SOC=… comes back"
S1_SCHRITT2 = "Tab “%s” → for “vehicle 1” the buttons “%s” and “%s”. In Loxone Config import the inputs: select “Virtual Inputs” in the tree, ribbon “Predefined HTTP devices → Import template…”; the control commands: in the tree “Virtual Outputs” → “Predefined devices → Import template…”. Import each file only ONCE (twice gives duplicate blocks). The two containers “BYD 1” and “BYD 1 steuern” serve all four pages."
S1_SCHRITT3 = "Create the page “BYD Autos”. Drag the 11 commands of the list from the container “BYD 1” (no. 1–11), plus the constant 1. Switch on “Statistics” in the properties window of BYD_1_SOC and BYD_1_REICHW."
S1_SCHRITT4 = "Create three notifications (Periphery → Messages → Notification): “Meldung Auto gestört (BYD)”, “Meldung Ladestand niedrig (BYD)” and “Meldung Ladung beendet (BYD)”, texts as in the list. Each gets exactly one connection."
S1_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect from top to bottom. On the Value Validator no. 13 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0). AND no. 24: negate input I2 – click its input point in Config; the input then shows a small circle. Status no. 18: click “+” twice first (V5, V6), status no. 27 three times (V5–V7); enter the rows in the given order, the one without condition last. Edge Detection no. 29: the connection to the notification leaves from output Off."
S1_SCHRITT6 = "Save and transfer. Check: “Zustand (BYD)” shows “läuft – Werte … s alt”; BYD_1_ALTER jumps back every 5 minutes."
S2_H1 = "“Ladefreigabe bestätigt (BYD)” (no. 14) is the switching output for a wallbox without its own control. If you use EVCC, leave out no. 12–14: EVCC controls the wallbox itself. The vehicle cannot start or stop charging via BYD – the plugin offers no command for it."
S2_H2 = "On no. 7–9: spot_awattar_rank -1 means “no rank” and does not count as cheap; without the spot price plugin the input stays 0, so never cheap. The switch-on delay no. 14 swallows the pulse of the comparators at every poll."
S2_H3 = "On no. 25 and 26: the climate command is analogue and sends the target temperature (<v.1>). As long as nothing is requested, the formula delivers -1 – the plugin rejects this value without effect. Stopping only works via “Klima aus (BYD)” (no. 27 and 28)."
S2_H4 = "The target temperature must lie between the limits in the plugin (16–30 °C by default), otherwise the plugin rejects the command and nothing happens. How long the vehicle runs the climate control is decided by BYD."
S2_H5 = "If you have switched on the preconditioning at the departure assistant in the plugin, leave the schedule no. 21 empty – otherwise there are two triggers for the same climate control. The schedule only preconditions when “Anwesenheit (eigene Quelle)” is 1 (nothing on holiday)."
S2_H6 = "Seat and battery heating: level 0 switches off – the off command of the control template sends it (since 0.9.26). Which levels the vehicle knows is not documented; look at it in the plugin tab Test “Switching” with a dry run."
S2_H7 = "Every immediate poll (no. 34 and 35) wakes the vehicle – do not trigger the push button cyclically."
S2_SCHRITT1 = "In the plugin tab “%s” set the tick “%s” (off by default) and enter the control PIN. If you want the charging recommendation of the plugin: switch on “%s” and enter the MQTT topic with price or surplus."
S2_SCHRITT2 = "The containers “BYD 1” and “BYD 1 steuern” come from the page “BYD Autos”, step 2 (do not import them again). Create the page “BYD Autos Laden und Klima”, drag the 8 commands from “BYD 1” (no. 1–5 and 16–18), plus spot_awattar_rank (create a virtual input named as in the name table on the tab “Loxone integration” of the plugin Spotpreis aWATTar, from 1.2.38 on; without the spot price plugin leave out no. 6–9 and leave input I2 of no. 10 free) and the five output commands BYD_1_KLIMA, BYD_1_KLIMA_AUS, BYD_1_SITZKLIMA, BYD_1_BATTERIEHEIZUNG and BYD_1_ABRUF from “BYD 1 steuern”."
S2_SCHRITT3 = "Create seven virtual inputs (switches no. 12 and 32, sliders no. 19 and 30, push buttons no. 20, 27 and 34; each with “Use in User Interface” on) and drag “Anwesenheit (eigene Quelle)” from the tree. Place the schedule no. 21 via the block search and enter ON Monday to Friday 06:40–07:00 in the schedule editor; its output AQ goes to the AND no. 23."
S2_SCHRITT4 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect them. Greater no. 7 and Less or Equal no. 8: enter the comparison value as parameter V2, leave the second input open. Status no. 15: click “+” three times first (V5–V7)."
S2_SCHRITT5 = "Save and transfer. Check: press “Klima jetzt (BYD)” – the plugin tab “%s” shows the command klima_start at 21 °C; “Klima aus (BYD)” stops the climate control."
S3_H1 = "BYD delivers locks, doors and windows only as codes; what 0, 1 or 2 means is not described by BYD. That is why no. 18 compares with the slider instead of a fixed value."
S3_H2 = "On no. 19–21: while driving the car is often not locked – a message only comes when it is standing (speed 0) and the values are fresh, and only after 5 minutes."
S3_H3 = "When it rains the Miniserver sends “close windows” once – even if the vehicle is parked elsewhere; that does no harm."
S3_H4 = "Locking, unlocking, find vehicle (horn and lights) and flashing are deliberately not on this page: they act on a vehicle in a public place. The plugin only offers them with a second tick (“%s”, off by default); without it the endpoint rejects them and the control template does not contain them."
S3_SCHRITT1 = "The containers come from the page “BYD Autos”, step 2 (do not import them again). Create the page “BYD Autos Fahrzeug”, drag the 16 commands from “BYD 1” (no. 1–16), the output command BYD_1_FENSTER_ZU from “BYD 1 steuern” and “Regensensor (eigene Quelle)” from the tree."
S3_SCHRITT2 = "Create two virtual inputs: the slider no. 17 “Schloss-Kennzahl verriegelt (BYD)” (start value 2) and the push button no. 23 “Fenster schließen (BYD)” (each with “Use in User Interface” on). Create the notification “Meldung Fahrzeug offen (BYD)”, text as in the list."
S3_SCHRITT3 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect them. Status no. 27: click “+” four times first (V5–V8), status no. 28 three times (V5–V7)."
S3_SCHRITT4 = "Compare once with the BYD app: lock the vehicle, read BYD_1_SCHLOSSVL after the next poll and set the slider “Schloss-Kennzahl verriegelt (BYD)” to this value (2 on the measured vehicle)."
S3_SCHRITT5 = "Save and transfer. Check: press “Fenster schließen (BYD)” – the plugin tab “%s” shows the command fenster_zu."
S4_H1 = "“Heute gefahren” shows 0 until midnight after a restart of the Miniserver."
S4_H2 = "The plugin only calculates the consumption of the last trip with an entered battery capacity (trips from 20 km); the vehicle reports the other two consumption values itself."
S4_H3 = "The tyre pressures always arrive in bar; the vehicle may report bar, psi or kPa (REIFENEH 1/2/3), the plugin converts. So 2.2 and 2.4 bar at no. 14 fit every vehicle. -1 means: implausible value (unknown unit) – no. 14 then reports as well; check the tyres and REIFENEH."
S4_H4 = "Gear position and ignition are codes of the interface without a described meaning; the status only shows them."
S4_SCHRITT1 = "Create the page “BYD Autos Werte”, drag the 12 commands from “BYD 1” (no. 1–12); switch on “Statistics” in the properties window of BYD_1_KM."
S4_SCHRITT2 = "Create the notification “Meldung Reifendruck niedrig (BYD)”. Place the remaining blocks via the block search (key F5) and connect them: Pulse at no. 19 “At a specific time” 00:00:00; the Analog Memory no. 20 keeps Rem (default). Status no. 18: click “+” once first (V5), status no. 22 four times (V5–V8)."
S4_SCHRITT3 = "Save and transfer. Check: compare “Reifendruck (BYD)” with the BYD app."
SCHRITTE_TITEL = "How to take over this page"
Z1_01 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_OK | 1 = last poll brought values and they are at most three times as old as the poll interval (300 s by default), otherwise 0 | —"
Z1_02 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_ALTER | seconds since the last successful poll; -1 = never one so far – the sign of life: changes at every poll | —"
Z1_03 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_FEHLFOLGE | unsuccessful polls in a row; 0 = the last one brought values | —"
Z1_04 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_ONLINE | reachability of the vehicle as a code of the interface (raw value, meaning not documented) | —"
Z1_05 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_FAHRZUST | vehicle state as a code of the interface (raw value, meaning not documented) | —"
Z1_06 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_SOC | state of charge of the traction battery in %%; statistics on | —"
Z1_07 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_REICHW | remaining range in km; statistics on | —"
Z1_08 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_LAEDT | 1 = vehicle is charging, 0 = not charging | —"
Z1_09 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_KABEL | 1 = charging cable plugged in, 0 = not | —"
Z1_10 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_RESTMIN | remaining time of the charging process in min | —"
Z1_11 = "Virtual HTTP input command (template “BYD 1”) | BYD_1_ZUHAUSE | 1 = vehicle within the radius of the home position (150 m by default), 0 = on the road; without a home position in the plugin no value comes | —"
Z1_12 = "Constant | Konstante 1 | value 1 | —"
Z1_13 = "Value Validator | Lebenszeichen fehlt (BYD) | Tmc 900 s (three times the polling time of 300 s), Min -1, Max 999999 – if the LoxBerry stands still, the age stays at its last value; remove the tick at ‘En’ in the properties window | V = #2, En = #12"
Z1_14 = "NOT | Keine frischen Daten (BYD) | — | I = #1"
Z1_15 = "OR | Störung (BYD) | — (no fresh data or sign of life missing) | I1 = #14, I2 = output E of #13"
Z1_16 = "Switch-On Delay | Störung bestätigt (BYD) | 600 s (two polls; a restart and a single failed poll report nothing) | Input = #15"
Z1_17 = "Notification | Meldung Auto gestört (BYD) | Text: BYD – no fresh vehicle values for 10 minutes, or the LoxBerry does not answer. Read the status “Zustand (BYD)” in the app | Input = #16"
Z1_18 = "Status | Zustand (BYD) | rows: V1 = 1 “sign of life missing for at least 15 minutes – LoxBerry or plugin does not answer; open the LoxBerry in the browser, in the plugin tab Settings ‘Start service’”; V3 < 0 “never a successful poll so far – in the plugin tab Settings enter user name, password and control PIN of the BYD account, then ‘Start service’”; V4 >= 3 “<v4> polls failed in a row – the plugin stretches the interval; in the plugin tab Test ‘Self-test of the service’”; V2 = 0 “no fresh values – last successful poll <v3> s ago; in the plugin tab Test ‘Measure endpoint now’”; without condition “running – values <v3> s old (reachability <v5>, state <v6> as codes)”; visualisation ON | V1 = output E of #13, V2 = #1, V3 = #2, V4 = #3, V5 = #4, V6 = #5"
Z1_19 = "Formula | Ladestand für Meldung (BYD) | IF(I1>0;I1;100) – a state of charge never reported (0: combustion car or before the first poll) does not count as low | I1 = #6"
Z1_20 = "Threshold Switch | Ladestand niedrig (BYD) | On 20 / Off 25 (%%; switches on when falling below 20 %%, off again above 25 %%) | Input = #19"
Z1_21 = "Formula | Reichweite für Meldung (BYD) | IF(I1>0;I1;999) – a range never reported (0) does not count as low | I1 = #7"
Z1_22 = "Threshold Switch | Reichweite gering (BYD) | On 50 / Off 70 (km; switches on when falling below 50 km, off again above 70 km) | Input = #21"
Z1_23 = "OR | Ladestand oder Reichweite knapp (BYD) | — | I1 = #20, I2 = #22"
Z1_24 = "AND | Knapp und nicht angesteckt (BYD) | — (I2 negated: in Config click the input point, a small circle appears; with the charging cable plugged in nothing is reported) | I1 = #23, I2 = #9 (negated)"

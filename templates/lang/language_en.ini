[LOX]
ALLES_TEXT = "The two buttons produce ready-made import files for Loxone Config. Inputs are imported under <span class='sm-mono'>Virtual Inputs → Predefined HTTP devices → Import template…</span>, outputs under <span class='sm-mono'>Virtual Outputs → Predefined devices → Import template…</span> — note that the output button lacks the word HTTP."
EINLEITUNG = "Two paths are available and they do not exclude each other. <b>MQTT</b> is the standard route: the gateway creates the virtual inputs itself, and in Loxone a suitably named input is enough. The <b>HTTP endpoint</b> is the route for anything Loxone should fetch itself — and the only one for write commands."

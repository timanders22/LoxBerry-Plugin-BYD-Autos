HERKUNFT_DOKU = "documentation"
HERKUNFT_GERECHNET = "computed"
HERKUNFT_UNBEKANNT = "unknown origin (%s)"
H_ALLES = "Create everything at once"
H_TITEL = "Loxone integration"
K_TOKEN_NEU = "Create a new token"
K_VORLAGE = "Create template for Loxone Config"
K_VORLAGE_VO = "Create template for the control commands"
MEHRERE_FAHRZEUGE = "Several vehicles: one address per vehicle"
S1_TEXT = "MQTT is preferable to HTTP polling: the gateway generates the input names itself, whereas the HTTP route needs a command recognition per value. If you only need a few values, or want to work without a broker, use the endpoint from step 3."
S1_TITEL = "Step 1: choose the path"
S2_TEXT = "The topic group of this plugin is:"
S2_TITEL = "Step 2: the subscription in the MQTT gateway"
S3_BEFEHLE = "<p>The title is for humans, the search text for the machine: the title may change without any existing installation noticing — what is searched for is still the text in the second column. The semicolon belongs <b>in the pattern</b>: Loxone searches literally and takes the first hit, and without the semicolon <span class='sm-mono'>KM=</span> would also occur inside a future <span class='sm-mono'>RESTKM=</span>.</p>"
S3_HERKUNFT = "The <b>Origin</b> column is meant seriously. <b>Documentation</b> means: the field name comes from an open source and was never measured against a car here. <b>Computed</b> means: the field does not come from the vehicle at all but arises here — if an ingredient is missing it stays empty. A field nobody measured must not look like one somebody did. The Test tab shows which fields the library actually matched on <b>your</b> vehicle."
S3_STRICH = "A <b>dash</b> as a value means: this value is not available. No 0 is sent on purpose — a 0 would look like a measurement. Loxone then keeps the last valid value, and the ALTER field says how old it is."
S3_TEXT = "One virtual HTTP input with this address fetches all values in a single call. One command recognition per value, using the search text from the table below."
S3_TITEL = "Step 3: virtual inputs over HTTP"
S4_TEXT = "The location is returned in a separate response so that the status line consists of whole numbers only. A latitude with a decimal point among integers would be a trap for a command recognition."
S4_TITEL = "Step 4: location"
S5_KEIN_LADEN = "<b>Starting and stopping charging is not offered here.</b> The library used names no method for it. An output the manufacturer cannot serve is not offered at all: a block that only collects refusals is worse than none."
S5_TEXT = "One virtual output per command. Use the host name of the LoxBerry as the address of the output and the path from the table as the command. A state belongs on <b>one</b> output with an on and an off command, not on two outputs — which is what the generated import file does."
S5_TITEL = "Step 5: sending commands"
S5_WARNUNG = "These addresses contain the token. If you create a new token you must update all of them — a virtual output does not evaluate the answer, so a failure would go unnoticed."
S6_TEXT = "The token protects the unauthenticated endpoint. The second address answers the question „is the token entered in Loxone still valid?“ <b>without triggering anything on the car</b> — no device contact, no write access. Without such a route there are only two bad options: either you really switch something, or you never find out."
S6_TITEL = "Step 6: token and self-test"
S7_TEXT = "<b>Virtual inputs keep their last value.</b> If the service fails, everything looks normal in the app. Two things are therefore wired up: <span class='sm-mono'>OK</span> (0 means this poll returned nothing) and <span class='sm-mono'>ALTER</span> (grows as long as nothing new arrives). Set the alarm threshold well above the polling interval so a single missed cycle raises nothing. And mind the special case: <span class='sm-mono'>ALTER = −1</span> means „there has never been a successful poll“ — which looks fresher than any real value, so always evaluate OK as well."
S7_TITEL = "Step 7: failure detection"
S8_ERLAEUTERUNG = "<p><b>On the AND and OR blocks:</b> in Loxone they have exactly two inputs. Where three conditions meet, two blocks are chained — a drawing with four inputs on an OR cannot be rebuilt.</p><p><b>On the notification block:</b> it only fires on a transition from off to on. Never wire several sources directly to its input — combine them with OR first, otherwise a permanently active source swallows all the others.</p><p><b>On Loxone time:</b> Loxone counts seconds since 1 January 2009. If a time block delivers Unix time (a value around 1.7 billion), subtract <span class='sm-mono'>1230768000</span>.</p>"
S8_TEXT = "Working through this table from top to bottom rebuilds the function without further thought. Loxone Config lists all blocks in the block search (F5). Optional rows are marked as such."
S8_TITEL = "Step 8: complete block list for rebuilding"
S9_TEXT = "Call these four addresses once in a browser. The fourth is the most important: only a <b>refusal</b> for an invented action makes the three successes meaningful."
S9_TITEL = "Step 9: cross-check"
TOKEN_NEU = "A new token was created. All previous addresses in the Miniserver are now invalid and must be updated."

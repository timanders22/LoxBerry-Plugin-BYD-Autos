VIN_HINWEIS = "Die laufende Nummer ist nach Fahrgestellnummer sortiert und bleibt damit stabil. In den Adressen für Loxone lässt sich statt der Nummer auch die Fahrgestellnummer angeben — das ist die haltbarere Angabe."
WARN_PW_OHNE_KONTO = "Es ist ein Passwort hinterlegt, aber kein Benutzername. So kann die Anmeldung nicht gelingen."
WAS_IST_DAS = "<b>BYD-Fahrzeuge über das BYD-Konto am Loxone Miniserver.</b> Ein Abrufdienst holt im eingestellten Takt Ladezustand, Reichweite, Türen, Schlösser und Fenster, Reifendrücke, Standort und weitere Werte über die Bibliothek pybyd aus der BYD-Cloud. Die Werte gehen über MQTT und über einen tokengeschützten HTTP-Endpunkt an den Miniserver. Über denselben Endpunkt lassen sich Verriegelung, Klimatisierung sowie Sitz- und Batterieheizung schalten – ab Werk gesperrt, und jeder Befehl lässt sich vorher als Trockenlauf prüfen."

[MQTT]
ABGERAEUMT = "Behaltene Themen unter dem bisherigen Präfix %s:"
ABODATEI_FEHLER = "Die Abodatei mqtt_subscriptions.cfg ließ sich nicht schreiben – das Abo im MQTT-Gateway bitte von Hand prüfen."
ABODATEI_NEU = "Die Abodatei des MQTT-Gateways lautet jetzt %s."
ABO_GEMESSEN = "(gemessen: Gateway&nbsp;V%d)"
ABO_SCHRITTE = "Die Themengruppe dieses Plugins lautet:"
ABO_UNBEKANNT = "Welche Fassung Ihr MQTT&#8209;Gateway hat, ließ sich nicht feststellen. <b>Fassung&nbsp;1</b> liest die Abodatei, die das Plugin selbst anlegt – ein Eintrag von Hand ist nicht nötig. <b>Fassung&nbsp;2:</b> ob die Themengruppe dort von selbst erscheint, ist an dieser Anlage nicht gemessen."
ABO_V2 = "<b>MQTT&#8209;Gateway V2.</b> Belegt ist nur, was im Quelltext des LoxBerry steht: die Seite <i>Subscriptions</i> hat unter V2 eine eigene Oberfläche, ihre Knöpfe sind abgeschaltet. Dass die Themengruppe dort von selbst erscheint und die Datenpunkte angehakt werden, ist an dieser Anlage <b>nicht gemessen</b>. Das Plugin legt seine Abodatei trotzdem an; ob V2 sie liest, ist ebenfalls nicht gemessen."
ABO_WARNUNG = "<b>MQTT&#8209;Gateway V1.</b> Das Plugin trägt dieses Abo selbst in die Datei <span class='sm-mono'>mqtt_subscriptions.cfg</span> seines Konfigurationsordners ein, und das Gateway V1 liest sie (im Quelltext des Gateways belegt). Ein Eintrag von Hand unter <i>System → MQTT Gateway</i>, Abschnitt <i>Subscriptions</i>, ist damit nicht mehr nötig; steht er schon da, schadet er nicht. Kommt trotzdem nichts an, ist das Abo der erste Ort zum Nachsehen."
AUTOSTART_AUS = "Das MQTT-Gateway steht nicht auf Autostart (<span class='sm-mono'>System → MQTT Gateway</span>). Es wird gesendet, aber vermutlich hört niemand zu."
AUTOSTART_EIN = "Das Gateway steht auf Autostart. Es startet nach einem Neustart des LoxBerry von selbst."
GATEWAY_ERKLAERUNG = "Das MQTT-Gateway ist seit LoxBerry 3 <b>Bestandteil des Systems</b> und kein Plugin. Es wird nicht nachinstalliert, sondern unter <span class='sm-mono'>System → MQTT Gateway</span> eingeschaltet."
H_ABO = "Das Abo im MQTT-Gateway"
H_THEMEN = "Alle Themen, die dieses Plugin veröffentlicht"
H_ZUSTAND = "Zustand des Gateways"
NICHT_GEFUNDEN = "In der <span class='sm-mono'>general.json</span> des LoxBerry ist kein MQTT-Abschnitt zu finden. Ohne ihn kann nichts weitergeleitet werden."
PLATZHALTER = "<span class='sm-mono'>N</span> steht für die laufende Nummer des Fahrzeugs, beginnend bei 1."
RETAIN_ERKLAERUNG = "Zurückbehalten (retain) gehen nur Zustände – etwa Zündung, Schloss oder Ladezustand –, damit Loxone nach einem Neustart des Miniservers oder des Gateways sofort den Stand hat. Messwerte mit Zeitbezug gehen ohne, damit nach einem Ausfall kein alter Wert aktuell aussieht. Der Zeitstempel ts und die beiden OK-Themen gehen nie zurückbehalten: sie sind das Lebenszeichen. Ebenso FEHLFOLGE: der Zähler erfolgloser Abrufe ist eine Aussage des Dienstes über sich selbst, und ein zurückbehaltenes „0“ bliebe nach dem Ende des Dienstes stehen. Ein Zustand ohne Aussage geht als <b>-</b> (Strich) zurückbehalten hinaus, nie leer. Schweigt ein Fahrzeug nur zeitweise, bleiben seine Zustände stehen, und fahrzeugN/OK geht auf 0 – ein Zustand gilt nur zusammen mit OK."
THEMEN_ERKLAERUNG = "Diese Liste entsteht aus derselben Quelle wie die Statuszeile des Endpunkts. Der MQTT-Weg trägt damit dieselben Werte wie der HTTP-Weg — ein Plugin, dessen MQTT-Meldung weniger enthält, macht die Umstellung unmöglich, und zwar unauffällig: es kommen ja Werte an, nur eben nicht alle. Der Reiter Test misst die Übereinstimmung nach."
T_AUTOSTART = "Autostart des Gateways"
T_BEDEUTUNG = "Bedeutung"
T_BROKER = "Broker"
T_PLUGIN = "Dieses Plugin sendet über MQTT"
T_RETAIN = "Zurückbehalten"
T_THEMA = "Thema"
T_UDP = "UDP-Eingang des Gateways"
UMBENENNUNG = "Über MQTT wird der <b>Zeitstempel</b> gesendet, nicht das Alter: beim Senden ist das Alter immer null. Die Gegenseite rechnet es aus. In Loxone gilt <span class='sm-mono'>Alter = (Loxone-Zeit + 1230768000) − ts</span> — Loxone zählt Sekunden seit dem 01.01.2009."

[LOX]
ALLES_TEXT = "Die beiden Knöpfe erzeugen fertige Importdateien für Loxone Config. Die Eingänge liest man unter <span class='sm-mono'>Virtuelle Eingänge → Vordefinierte HTTP-Geräte → Vorlage Importieren…</span> ein, die Ausgänge unter <span class='sm-mono'>Virtuelle Ausgänge → Vordefinierte Geräte → Vorlage Importieren…</span> — beim Ausgang fehlt im Knopfnamen der Zusatz HTTP."
BILD_ALT = "Bausteine des Plugins in Loxone Config"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
EINGRIFF = "nur mit dem zweiten Haken"
EINLEITUNG = "Zwei Wege stehen offen, gleichwertig, und sie schließen sich nicht aus. Über <b>MQTT</b> legt das Gateway die virtuellen Eingänge selbst an; der <b>HTTP-Endpunkt</b> liefert alle Werte eines Fahrzeugs in einem Abruf, mit fertigen Vorlagen – und er ist der einzige Weg für schreibende Befehle. Das Musterprojekt und die vier Seiten in Schritt 8 nutzen HTTP."
HERKUNFT_BESTAND = "gemessen"
HERKUNFT_DOKU = "Dokumentation"
HERKUNFT_GERECHNET = "gerechnet"
HERKUNFT_UNBEKANNT = "unbekannte Herkunft (%s)"
H_ALLES = "Alles auf einmal anlegen"
H_TITEL = "Einbindung in Loxone"
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage für Loxone Config erzeugen"
K_VORLAGE_VO = "Vorlage der Steuerbefehle erzeugen"
MEHRERE_FAHRZEUGE = "Mehrere Fahrzeuge: je Fahrzeug eine eigene Adresse"
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
S1_TEXT = "Beide Wege sind gleichwertig. <b>HTTP</b> (Schritt 3): eine Vorlage je Fahrzeug, ein Abruf für alle Werte, das Alter jedes Werts steht dabei, und im Browser sieht man sofort, was ankommt – so arbeiten das Musterprojekt und die Seiten in Schritt 8. <b>MQTT</b> (ab Werk aus): das Gateway erzeugt die Namen der Eingänge selbst und liefert zusätzlich die Ladeempfehlung nach Strompreis. Beide Wege gleichzeitig ergeben doppelte Eingänge."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Die Themengruppe dieses Plugins lautet:"
S2_TITEL = "Schritt 2: Das Abo im MQTT-Gateway"
S3_BEFEHLE = "<p>Der Titel ist für Menschen, der Suchtext für die Maschine: der Titel darf sich ändern, ohne dass eine bestehende Anlage etwas merkt — gesucht wird weiter nach dem Text in der zweiten Spalte. Das Semikolon gehört <b>ins Muster</b>: Loxone sucht wörtlich und nimmt den ersten Treffer, und ohne das Semikolon steckte <span class='sm-mono'>KM=</span> auch in einem künftigen <span class='sm-mono'>RESTKM=</span>.</p>"
S3_HERKUNFT = "Die Spalte <b>Herkunft</b> ist ernst gemeint. <b>Dokumentation</b> heißt: der Feldname stammt aus einer offenen Quelle und ist an keinem Fahrzeug dieses Hauses gemessen. <b>Gerechnet</b> heißt: das Feld kommt gar nicht vom Fahrzeug, sondern entsteht hier — fehlt die Zutat, bleibt es leer. Ein Feld, das niemand gemessen hat, darf nicht aussehen wie eines, das jemand gemessen hat. Der Reiter Test zeigt, welche Felder die Bibliothek bei <b>Ihrem</b> Fahrzeug wirklich getroffen hat."
S3_OK = "OK ist 0, sobald das Abbild älter ist als das Dreifache des Abrufintervalls (derzeit %d Sekunden); ALTER steht unverändert daneben. Gibt es noch gar keine Daten, antwortet der Endpunkt mit HTTP 503 und GRUND=KEINE_DATEN."
S3_STRICH = "Ein <b>Strich</b> als Wert bedeutet: dieser Wert liegt nicht vor. Es wird bewusst keine 0 gesendet — eine 0 sähe aus wie ein Messwert. Loxone behält dann den letzten gültigen Wert, und dass er alt ist, sagt das Feld ALTER."
S3_TEXT = "Ein virtueller HTTP-Eingang mit dieser Adresse holt alle Werte in einem Aufruf. Je Wert eine Befehlserkennung mit dem Suchtext aus der Tabelle darunter."
S3_TITEL = "Schritt 3: Virtuelle Eingänge über HTTP"
S4_TEXT = "Der Standort steht in einer eigenen Antwort, damit die Statuszeile aus reinen Ganzzahlen besteht. Ein Breitengrad mit Punkt zwischen Ganzzahlen wäre für eine Befehlserkennung eine Falle."
S4_TITEL = "Schritt 4: Standort"
S5_KEIN_LADEN = "<b>Laden starten und anhalten gibt es hier nicht.</b> Die verwendete Bibliothek nennt dafür keine Methode. Ein Ausgang, den der Hersteller nicht bedienen kann, wird gar nicht erst angeboten: ein Baustein, der nur Absagen erntet, ist schlimmer als keiner."
S5_TEXT = "Je Befehl ein virtueller Ausgang. Als Adresse des Ausgangs trägt man den Rechnernamen des LoxBerry ein, als Befehl den Pfad aus der Tabelle; die erzeugte Importdatei macht das so. Klima, Sitz- und Batterieheizung sind dort <b>analoge</b> Ausgänge: den Wert liefert der Baustein, der den Ausgang ansteuert – die Zieltemperatur als <span class='sm-mono'>&lt;v.1&gt;</span>, die Stufe als <span class='sm-mono'>&lt;v.0&gt;</span>. <b>Klima</b> hat seit 0.9.26 keinen Ausbefehl mehr, angehalten wird über den eigenen Befehl <span class='sm-mono'>BYD_1_KLIMA_AUS</span>; Sitz- und Batterieheizung senden beim Ausschalten Stufe 0. Am Miniserver ist das nicht gemessen. Verriegeln, Entriegeln, Fahrzeug suchen und Blinken brauchen zusätzlich den zweiten Haken im Reiter Einstellungen."
S5_TITEL = "Schritt 5: Befehle senden"
S5_WARNUNG = "Diese Adressen enthalten das Token. Wer ein neues Token erzeugt, muss sie alle nachziehen — ein virtueller Ausgang wertet die Antwort nicht aus, ein Ausfall bliebe also still."
S6_TEXT = "Das Token schützt den unangemeldeten Endpunkt. Die zweite Adresse beantwortet die Frage „stimmt das in Loxone eingetragene Token noch?“ <b>ohne am Fahrzeug etwas auszulösen</b> — kein Gerätekontakt, kein Schreibzugriff. Ohne so einen Weg gibt es nur zwei schlechte Möglichkeiten: entweder man schaltet wirklich, oder man erfährt es nie."
S6_TITEL = "Schritt 6: Token und Selbsttest"
S7_TEXT = "<b>Virtuelle Eingänge behalten ihren letzten Wert.</b> Fällt der Dienst aus, sieht in der App alles normal aus. Verdrahtet werden deshalb drei Dinge: <span class='sm-mono'>OK</span> (0 heißt: dieser Abruf hat nichts gebracht, oder das Abbild ist älter als das Dreifache des Abrufintervalls), <span class='sm-mono'>ALTER</span> (wächst, solange nichts Neues kommt) und eine <b>Analogwertvalidierung</b> auf ALTER: steht der LoxBerry selbst, frieren OK und ALTER ein, und nur die Validierung merkt, dass sich ALTER nicht mehr ändert (Seite „BYD Autos“ in Schritt 8, Tmc dreimal die Abfragezeit). Der Sonderfall <span class='sm-mono'>ALTER = −1</span> heißt „es hat noch nie einen erfolgreichen Abruf gegeben“ – OK ist deshalb immer mit auszuwerten."
S7_TITEL = "Schritt 7: Ausfallerkennung"
S8_TEXT = "Vier Seiten aus dem LoxBerry-Plugins Musterprojekt, dort in Loxone Config gebaut und verbunden. Jede Zeile ein Baustein; Loxone Config führt alle in der Baustein-Suche (Taste F5). Wer nur überwachen will, übernimmt die erste Seite allein. Die Namen gelten für Fahrzeug 1 so, wie die Vorlagen sie anlegen; die Titel der Vorlagen sind fest (BYD_1_…), auch bei englischer Oberfläche. Eingreifende Befehle (Verriegeln, Suchen, Blinken) nutzt das Musterprojekt nicht."
S8_TITEL = "Schritt 8: Vier Seiten aus dem Musterprojekt zum Nachbauen"
S9_TEXT = "Diese vier Adressen einmal im Browser aufrufen. Die vierte ist die wichtigste: erst eine <b>Absage</b> auf eine erfundene Aktion macht die drei Erfolge aussagekräftig."
S9_TITEL = "Schritt 9: Gegenprobe"

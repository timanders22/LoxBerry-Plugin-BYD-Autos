[BAUSTEIN]
HINWEISE_TITEL = "Hinweise"
S1_H1 = "Die Meldung „Auto gestört“ kommt erst nach 10 Minuten Störung. Steht der LoxBerry selbst, merkt es die Analogwertvalidierung nach 15 Minuten; die Meldung folgt 10 Minuten später."
S1_H2 = "Zu Nr. 13: steht der LoxBerry, behalten alle Eingänge ihren letzten Wert; nur das stehende BYD_1_ALTER verrät es. Jeder Abruf weckt das Fahrzeug – den Takt im Plugin nicht unter 300 s stellen; wer ihn oder die Abfragezeit am Behälter erhöht, setzt Tmc auf das Dreifache der Abfragezeit."
S1_H3 = "Zu Nr. 19–25: ein Schwellwertschalter hinter einem abgefragten Eingang gibt bei jeder Abfrage einen kurzen Impuls; die Einschaltverzögerung Nr. 25 schluckt ihn. Die Formeln Nr. 19 und 21 sorgen dafür, dass ein nie gemeldeter Wert (0, etwa nach einem Neustart des Miniservers) nicht als knapp zählt."
S1_H4 = "Zu Nr. 28–30: „Meldung Ladung beendet“ kommt bei jedem Ladeende nach mindestens einer Minute Laden – auch beim Kabelziehen oder einem Abbruch."
S1_H5 = "Die Ansagen „Ladung beendet“ und „Keine Daten mehr“ spricht das Plugin selbst (Reiter Einstellungen, Sprachausgabe, ab Werk aus) – dafür braucht es keinen Baustein."
S1_H6 = "Zweites Fahrzeug: im Reiter „Einbindung in Loxone“ die Vorlagen für Fahrzeug 2 holen (Behälter „BYD 2“, Befehle BYD_2_…) und die Seiten mit diesen Befehlen ein zweites Mal anlegen; die Störungen beider Fahrzeuge über ein weiteres ODER vor die Einschaltverzögerung führen – nie zwei Quellen direkt an eine Benachrichtigung."
S1_H7 = "Ein Strich vom Plugin heißt „liegt nicht vor“ – der Eingang behält dann seinen letzten Wert. Hat das Fahrzeug schon einmal geantwortet, enthält die Eingangsvorlage nur die Felder, die es liefert; vorher alle 42, so wie im Musterprojekt."
S1_SCHRITT1 = "Im Plugin Reiter „%s“ Benutzername, Passwort und Steuer-PIN des BYD-Kontos eintragen, „%s“ drücken und einen Takt (5 Minuten) warten. Wer geladene Energie und Verbrauch will, trägt die nutzbare Batteriekapazität ein, wer „zu Hause“ will, die Heimatposition. Reiter „%s“ → „%s“: es kommt eine Zeile BYD;OK=1;SOC=…"
S1_SCHRITT2 = "Reiter „%s“ → bei „Fahrzeug 1“ die Knöpfe „%s“ und „%s“. In Loxone Config die Eingänge im Baum „Virtuelle Eingänge“ wählen, Menüband „Vordefinierte HTTP-Geräte → Vorlage importieren…“, die Steuerbefehle im Baum „Virtuelle Ausgänge“ → „Vordefinierte Geräte → Vorlage importieren…“. Jede Datei nur EINMAL einlesen (zweimal ergibt doppelte Bausteine). Die beiden Behälter „BYD 1“ und „BYD 1 steuern“ dienen allen vier Seiten."
S1_SCHRITT3 = "Seite „BYD Autos“ anlegen. Aus dem Behälter „BYD 1“ die 11 Befehle der Liste ziehen (Nr. 1–11), dazu die Konstante 1. An BYD_1_SOC und BYD_1_REICHW im Eigenschaftsfenster „Statistik“ einschalten."
S1_SCHRITT4 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Auto gestört (BYD)“, „Meldung Ladestand niedrig (BYD)“ und „Meldung Ladung beendet (BYD)“, Texte wie in der Liste. Jede bekommt genau eine Leitung."
S1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden. An der Analogwertvalidierung Nr. 13 den Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). UND Nr. 24: den Eingang I2 negieren – in Config auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Status Nr. 18: vorher zweimal „+“ klicken (V5, V6), Status Nr. 27 dreimal (V5–V7); die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt. Flankenerkennung Nr. 29: die Leitung zur Benachrichtigung geht vom Ausgang Off ab."
S1_SCHRITT6 = "Speichern und übertragen. Probe: „Zustand (BYD)“ zeigt „läuft – Werte … s alt“; BYD_1_ALTER springt alle 5 Minuten zurück."
S2_H1 = "„Ladefreigabe bestätigt (BYD)“ (Nr. 14) ist der Schaltausgang für eine Wallbox ohne eigene Regelung. Wer EVCC nutzt, lässt Nr. 12–14 weg: EVCC regelt die Wallbox selbst. Laden starten oder anhalten kann das Fahrzeug über BYD nicht – das Plugin bietet dafür keinen Befehl."
S2_H2 = "Zu Nr. 7–9: spot_awattar_rank -1 heißt „kein Rang“ und zählt nicht als günstig; ohne Spotpreis-Plugin bleibt der Eingang 0, also nie günstig. Die Einschaltverzögerung Nr. 14 schluckt den Impuls der Vergleicher bei jeder Abfrage."
S2_H3 = "Zu Nr. 25 und 26: der Klima-Befehl ist analog und sendet die Zieltemperatur (<v.1>). Solange nichts angefordert ist, liefert die Formel -1 – diesen Wert weist das Plugin ohne Wirkung ab. Angehalten wird nur über „Klima aus (BYD)“ (Nr. 27 und 28)."
S2_H4 = "Die Zieltemperatur muss zwischen den Grenzen im Plugin liegen (ab Werk 16–30 °C), sonst weist das Plugin den Befehl ab und es passiert nichts. Wie lange das Fahrzeug klimatisiert, entscheidet BYD."
S2_H5 = "Wer im Plugin die Vorklimatisierung am Abfahrtsassistenten eingeschaltet hat, lässt die Schaltuhr Nr. 21 leer – sonst gibt es zwei Auslöser für dieselbe Klimatisierung. Die Schaltuhr klimatisiert nur, wenn „Anwesenheit (eigene Quelle)“ 1 ist (im Urlaub nichts)."
S2_H6 = "Sitz- und Batterieheizung: Stufe 0 schaltet aus – der Ausbefehl der Steuervorlage sendet sie (seit 0.9.26). Welche Stufen das Fahrzeug kennt, ist nicht dokumentiert; im Plugin Reiter Test „Schalten“ mit Trockenlauf ansehen."
S2_H7 = "Jeder Sofortabruf (Nr. 34 und 35) weckt das Fahrzeug – die Taste nicht im Takt auslösen."
S2_SCHRITT1 = "Im Plugin Reiter „%s“ den Haken „%s“ setzen (ab Werk aus) und die Steuer-PIN eintragen. Wer die Ladeempfehlung des Plugins will: „%s“ einschalten und das MQTT-Thema mit Preis oder Überschuss eintragen."
S2_SCHRITT2 = "Die Behälter „BYD 1“ und „BYD 1 steuern“ kommen von der Seite „BYD Autos“, Schritt 2 (nicht erneut einlesen). Seite „BYD Autos Laden und Klima“ anlegen, die 8 Befehle aus „BYD 1“ ziehen (Nr. 1–5 und 16–18), dazu spot_awattar_rank (Virtuellen Eingang mit dem Namen aus der Namenstabelle im Reiter ‚Einbindung in Loxone‘ des Plugins Spotpreis aWATTar, ab 1.2.38, anlegen; ohne Spotpreis-Plugin Nr. 6–9 weglassen und an Nr. 10 den Eingang I2 frei lassen) und die fünf Ausgangsbefehle BYD_1_KLIMA, BYD_1_KLIMA_AUS, BYD_1_SITZKLIMA, BYD_1_BATTERIEHEIZUNG und BYD_1_ABRUF aus „BYD 1 steuern“."
S2_SCHRITT3 = "Sieben Virtuelle Eingänge anlegen (Schalter Nr. 12 und 32, Schieberegler Nr. 19 und 30, Tasten Nr. 20, 27 und 34; je „In Visualisierung verwenden“ an) und „Anwesenheit (eigene Quelle)“ aus dem Baum ziehen. Schaltuhr Nr. 21 über die Baustein-Suche setzen und im Schaltuhr-Editor Montag bis Freitag 06:40–07:00 EIN eintragen; ihr Ausgang AQ geht an das UND Nr. 23."
S2_SCHRITT4 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, verbinden. Größer Nr. 7 und Kleiner oder gleich Nr. 8: den Vergleichswert als Parameter V2 eintragen, den zweiten Eingang offen lassen. Status Nr. 15: vorher dreimal „+“ klicken (V5–V7)."
S2_SCHRITT5 = "Speichern und übertragen. Probe: „Klima jetzt (BYD)“ drücken – im Plugin Reiter „%s“ steht der Befehl klima_start mit 21 °C; „Klima aus (BYD)“ hält die Klimatisierung an."
S3_H1 = "Schlösser, Türen und Fenster liefert BYD nur als Kennzahlen; was 0, 1 oder 2 heißt, ist von BYD nicht beschrieben. Deshalb vergleicht Nr. 18 mit dem Schieberegler statt mit einem festen Wert."
S3_H2 = "Zu Nr. 19–21: während der Fahrt ist das Auto oft nicht verriegelt – gemeldet wird nur, wenn es steht (Geschwindigkeit 0) und die Werte frisch sind, und erst nach 5 Minuten."
S3_H3 = "Bei Regen schickt der Miniserver einmal „Fenster schließen“ – auch wenn das Fahrzeug woanders steht; das schadet nicht."
S3_H4 = "Verriegeln, Entriegeln, Fahrzeug suchen (Hupe und Licht) und Blinken stehen bewusst nicht auf dieser Seite: sie greifen in ein Fahrzeug im öffentlichen Raum ein. Das Plugin bietet sie nur mit einem zweiten Haken an („%s“, ab Werk aus); ohne ihn weist der Endpunkt sie ab, und die Steuervorlage enthält sie nicht."
S3_SCHRITT1 = "Die Behälter kommen von der Seite „BYD Autos“, Schritt 2 (nicht erneut einlesen). Seite „BYD Autos Fahrzeug“ anlegen, die 16 Befehle aus „BYD 1“ ziehen (Nr. 1–16), den Ausgangsbefehl BYD_1_FENSTER_ZU aus „BYD 1 steuern“ und „Regensensor (eigene Quelle)“ aus dem Baum."
S3_SCHRITT2 = "Zwei Virtuelle Eingänge anlegen: den Schieberegler Nr. 17 „Schloss-Kennzahl verriegelt (BYD)“ (Startwert 2) und die Taste Nr. 23 „Fenster schließen (BYD)“ (je „In Visualisierung verwenden“ an). Die Benachrichtigung „Meldung Fahrzeug offen (BYD)“ anlegen, Text wie in der Liste."
S3_SCHRITT3 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, verbinden. Status Nr. 27: vorher viermal „+“ klicken (V5–V8), Status Nr. 28 dreimal (V5–V7)."
S3_SCHRITT4 = "Einmal mit der BYD-App vergleichen: das Fahrzeug verriegeln, nach dem nächsten Abruf BYD_1_SCHLOSSVL ablesen und den Schieberegler „Schloss-Kennzahl verriegelt (BYD)“ auf diesen Wert stellen (am gemessenen Fahrzeug 2)."
S3_SCHRITT5 = "Speichern und übertragen. Probe: „Fenster schließen (BYD)“ drücken – im Plugin Reiter „%s“ steht der Befehl fenster_zu."
S4_H1 = "„Heute gefahren“ zeigt nach einem Neustart des Miniservers bis Mitternacht 0."
S4_H2 = "Den Verbrauch der letzten Fahrt rechnet das Plugin nur mit eingetragener Batteriekapazität (Fahrten ab 20 km); die beiden anderen Verbrauchswerte meldet das Fahrzeug selbst."
S4_H3 = "Die Reifendrücke kommen immer in bar; das Fahrzeug kann bar, psi oder kPa melden (REIFENEH 1/2/3), das Plugin rechnet um. 2,2 und 2,4 bar an Nr. 14 passen damit für jedes Fahrzeug. -1 heißt: Wert unplausibel (unbekannte Einheit) – dann meldet auch Nr. 14; Reifen und REIFENEH prüfen."
S4_H4 = "Fahrstufe und Zündung sind Kennzahlen der Schnittstelle ohne beschriebene Bedeutung; der Status zeigt sie nur an."
S4_SCHRITT1 = "Seite „BYD Autos Werte“ anlegen, die 12 Befehle aus „BYD 1“ ziehen (Nr. 1–12); an BYD_1_KM im Eigenschaftsfenster „Statistik“ einschalten."
S4_SCHRITT2 = "Die Benachrichtigung „Meldung Reifendruck niedrig (BYD)“ anlegen. Übrige Bausteine über die Baustein-Suche (Taste F5) setzen und verbinden: Impuls um Nr. 19 „Zu bestimmter Uhrzeit“ 00:00:00; der Analogspeicher Nr. 20 behält Rem (Vorgabe). Status Nr. 18: vorher einmal „+“ klicken (V5), Status Nr. 22 viermal (V5–V8)."
S4_SCHRITT3 = "Speichern und übertragen. Probe: „Reifendruck (BYD)“ mit der BYD-App vergleichen."

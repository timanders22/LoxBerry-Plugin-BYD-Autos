SICH_WARNUNG = "<b>Die Datei enthält Ihre Zugangsdaten.</b> Ohne sie stünden nach dem Zurückspielen alle Felder richtig, und das Plugin käme trotzdem nicht an die Anlage. Behandeln Sie die Datei wie ein Passwort: nicht in ein Forum hängen und nicht an einen Fehlerbericht heften."

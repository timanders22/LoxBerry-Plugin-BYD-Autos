ERKLAERUNG = "Ein Ladevorgang wird am Wechsel des Feldes <code>LAEDT</code> erkannt — nicht von BYD gemeldet. Die Liste steht in <code>verlauf/ladungen.csv</code> im Datenordner. <b>Das Installationsprogramm des LoxBerry räumt diesen Ordner bei jeder Aktualisierung vollständig ab</b>; das Plugin trägt die Liste deshalb selbst hinüber: <code>preupgrade.sh</code> legt sie neben den Konfigurationsordner, <code>postinstall.sh</code> holt sie zurück. Eine <b>Deinstallation</b> überlebt sie nicht — dabei wird auch diese Zweitschrift entfernt. Wer sie darüber hinaus behalten will, kopiert die Datei vorher aus dem Datenordner."
GENAUIGKEIT = "<b>Was diese Zahlen sind.</b> Beginn und Ende sind die Zeitpunkte der <i>Abrufe</i>, an denen der Wechsel auffiel — sie liegen bis zu einem Abrufabstand neben der Wirklichkeit. Die kWh sind aus der Änderung des Ladezustands und der eingetragenen Kapazität gerechnet, nicht gemessen: Ladeverluste stecken nicht darin, und ein falsch eingetragener Kapazitätswert verfälscht jede Zeile gleichmäßig."

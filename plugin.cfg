[AUTHOR]
# Autorenname, E-Mail und Plugin-Name bilden zusammen den MD5-Schluessel in
# der plugindatabase.json. Nach der ersten Veroeffentlichung NIE mehr aendern -
# LoxBerry erkennt das Plugin sonst nicht wieder und Updates schlagen fehl.
NAME=BYD Plugin Authors
EMAIL=bydautos@users.noreply.github.com

[PLUGIN]
# KEIN KOMMA in einem Wert, der als EIN Wert gemeint ist: plugininstall.pl
# liest die Datei mit Config::Simple, und das zerlegt jeden Wert am Komma zu
# einer Liste. In der plugindatabase.json stuende danach eine JSON-Liste, im
# Menue erschiene ARRAY(0x...) und plugininstall.cgi braeche ab. Gemessen am
# Waermepumpe-Plugin (17.08.2026).
#
# TITLE kurz halten: plugininstall.pl kuerzt ab 26 Zeichen auf 22 + "...".
VERSION=0.9.22
NAME=bydautos
FOLDER=bydautos
TITLE=BYD Autos

[AUTOUPDATE]
# EINGESCHALTET (BERICHTIGT in 0.9.19, I6: hier stand "ausgeschaltet, zu
# dieser Fassung gibt es noch kein Repository" - das Repository und die
# Releases gibt es, und der Schalter steht darunter auf true).
#
# Angeboten wird eine Fassung erst, wenn release.cfg bzw. prerelease.cfg im
# Zweig sie nennen. Die Reihenfolge bei jeder Veroeffentlichung (Regeln/11):
#   1. Inhalt in den Zweig schieben
#   2. Tag vX.Y.Z anlegen und das Release dazu
#   3. messen, dass das Tag-Archiv mit HTTP 200 antwortet
#   4. DANACH release.cfg und prerelease.cfg im Zweig auf die Nummer setzen
# Zu frueh gesetzt heisst HTTP 404 auf jeder fremden Anlage.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-BYD-Autos/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-BYD-Autos/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Untergrenze 3.0.1, nicht 3.0.0 - und das hat einen gemessenen Grund:
#
# Die Bibliothek pybyd verlangt Python 3.11 oder neuer (Metadaten von pybyd
# 0.0.73 auf PyPI: "Requires-Python >=3.11"). LoxBerry 3.0.0 laeuft auf
# Debian 11 "Bullseye" und bringt Python 3.9 mit; erst LoxBerry 3.0.1 und 4.0
# laufen auf Debian 12 "Bookworm" mit Python 3.11.
#
# Auf einem LoxBerry 3.0.0 liesse sich das Plugin also installieren und der
# Dienst koennte nie starten. Eine benannte Absage ist besser als ein
# stillschweigend totes Plugin.
LB_MINIMUM=3.0.1
# Keine Obergrenze: plugininstall.pl bricht bei Ueberschreitung ab, statt nur
# zu warnen. Eine Obergrenze braucht einen belegten Grund - hier gibt es keinen.
LB_MAXIMUM=false
ARCHITECTURE=false

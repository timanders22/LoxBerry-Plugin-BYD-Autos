[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update. Sie nennt, was als Tag WIRKLICH liegt - nicht, was im
# Arbeitsordner entsteht. Eine Adresse auf einen Tag, den es nicht gibt,
# antwortet mit HTTP 404, und zwar auf jeder fremden Anlage, bevor jemand
# hinsieht.
#
# DARUM GEHT DIESE NUMMER DER FASSUNG HINTERHER. Steht im Arbeitsordner 0.9.6
# und hier 0.9.5, ist das kein Versehen: 0.9.5 ist der Stand, den man laden
# kann.
#
# Bei jedem Release in DIESER Reihenfolge (REGELN_4):
#   1. Inhalt in den Zweig schieben, release.cfg noch auf der alten Nummer
#   2. Tag v<nummer> anlegen und das Release dazu
#   3. messen: curl -s -o /dev/null -w "%{http_code}" -L \
#        https://github.com/<konto>/<repo>/archive/refs/tags/v<nummer>.zip
#      Erst eine 200 erlaubt den naechsten Schritt.
#   4. DANACH VERSION und beide Adressen hier setzen - am besten mit
#      Werkzeuge/fassung_setzen.py ORDNER <nummer> --auch-release; das Werkzeug
#      weigert sich, solange der Tag fehlt.

VERSION=0.9.6
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-BYD-Autos/archive/refs/tags/v0.9.6.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-BYD-Autos/releases/tag/v0.9.6

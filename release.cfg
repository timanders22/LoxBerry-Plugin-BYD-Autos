[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update. Solange es kein Repository und keinen Tag gibt, stehen hier
# KEINE Adressen: LoxBerry liest die Fassung aus dem Zweig und zieht das Archiv
# aus dem Tag. Eine Adresse auf einen Tag, den es nicht gibt, antwortet mit
# HTTP 404 - und zwar auf jeder fremden Anlage, bevor jemand hinsieht.
#
# Beim ersten Release in DIESER Reihenfolge (REGELN_4):
#   1. Inhalt in den Zweig schieben, release.cfg noch auf der alten Nummer
#   2. Tag v0.9.0 anlegen und das Release dazu
#   3. messen: curl -s -o /dev/null -w "%{http_code}" -L \
#        https://github.com/<konto>/<repo>/archive/refs/tags/v0.9.0.zip
#      Erst eine 200 erlaubt den naechsten Schritt.
#   4. DANACH VERSION und beide Adressen hier setzen - am besten mit
#      Werkzeuge/fassung_setzen.py ORDNER 0.9.0 --auch-release; das Werkzeug
#      weigert sich, solange der Tag fehlt.

VERSION=0.9.1
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-BYD-Autos/archive/refs/tags/v0.9.1.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-BYD-Autos/releases/tag/v0.9.1

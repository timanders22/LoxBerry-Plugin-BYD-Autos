<?xml version="1.0" encoding="UTF-8"?>
<!--
  BYD Autos - Plugin-Symbol nach Hausstandard.

  ERZEUGT von Werkzeuge/byd_symbol_erzeugen.py - nicht von Hand aendern.
  Dasselbe Werkzeug erzeugt die vier PNG aus DERSELBEN Geometrie; wer
  hier etwas aendert, ohne das Werkzeug zu benutzen, laesst Vektor und
  Bild auseinanderlaufen - und LoxBerry 3 zeigt das PNG.

  Aufbau: Scheibe r=246 mit Radialverlauf, innerer Ring r=232 mit
  28 % Deckung und Breite 6 (Hausmass aus REGELN_2), flaches weisses
  Motiv, gestrichelte Trennlinie bei y=345, darunter zwei Textzeilen.
  Der Ring wich bis 0.9.5 mit 35 % und Breite 3 vom Hausmass ab; die
  vier Schwesterplugins tragen die alten Werte noch.

  Keine fremde Wortmarke ausser dem Herstellernamen im Plugin-Namen -
  bei den Auto-Plugins ist er noetig, weil sich die Wagen sonst nicht
  unterscheiden lassen. Das Fahrzeug ist eine eigene Silhouette und
  bildet kein bestimmtes Modell nach. Der Blitz ueber dem Wagen ist das
  Beizeichen dieser Linie; die Schwestern tragen dort Funkwellen.
-->
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Scheibe und innerer Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6" />

  <g filter="url(#shadow)">
    <!-- Blitz: Beizeichen fuer den Elektroantrieb -->
    <polygon points="268,88 232,138 252,138 240,170 280,120 258,120 272,88" fill="#ffffff" />

    <!-- Wagen in Seitenansicht, eigener Umriss -->
    <polygon points="112,286 112,258 118,248 150,240 166,236 192,208 214,195 246,190 292,191 318,199 344,216 368,231 392,238 402,248 404,260 404,286" fill="#ffffff" />

    <!-- Seitenfenster, in Gruen ausgespart -->
    <polygon points="200,232 220,206 248,200 248,232" fill="#6dac20" />
    <polygon points="258,200 296,202 330,232 258,232" fill="#6dac20" />

    <!-- Raeder: weisser Reifen, gruene Nabe -->
    <circle cx="182" cy="288" r="32" fill="#ffffff" />
    <circle cx="338" cy="288" r="32" fill="#ffffff" />
    <circle cx="182" cy="288" r="14" fill="#6dac20" />
    <circle cx="338" cy="288" r="14" fill="#6dac20" />

    <!-- Gestrichelte Trennlinie -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" fill="none" />
  </g>

  <!-- Schrift. Die Hausregel verlangt fuer eine Wortmarke einen Pfad
       statt <text>; Schriftumrisse lassen sich auf diesem Rechner nicht
       erzeugen. Die vier Schwesterplugins halten es genauso. Wer den
       Pfad nachtraegt, aendert die Geometrie im Werkzeug, nicht hier. -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="29" letter-spacing="1">BYD AUTOS</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
